# Render blueprint for cgen (Docker, Free tier).
# Deploy: push to GitHub, then Render Dashboard -> New -> Blueprint -> select repo.
# Or: New -> Web Service -> Docker -> point at backend/Dockerfile.
services:
  - type: web
    name: cgen-poc
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      # Milestone 2: Groq API key. sync:false keeps the secret out of git;
      # set the value in the Render Dashboard (service -> Environment).
      - key: GROQ_API_KEY
        sync: false
      # M10.2: Byteship project key (bship_...). sync:false keeps the secret
      # out of git. When set, generated STEP/STL files are delivered through
      # Byteship; when unset the app falls back to the in-process download
      # store. Set the value in the Render Dashboard (service -> Environment).
      - key: BYTESHIP_API_KEY
        sync: false
      # M11: Firebase. FIREBASE_PROJECT_ID identifies the project that issued
      # the ID tokens and is used to verify their audience. It is deployment-
      # specific, so set it in the Render Dashboard when turning auth on.
      # REQUIRE_AUTH=true gates /generate, /modify, /rebuild, /remint and
      # /assembly/*; leaving it false keeps those routes open.
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: REQUIRE_AUTH
        value: "false"
      # M13: public-launch limits. Both are enforced before any AI or CAD work,
      # so a script cannot drain the Groq key or the instance in one afternoon.
      # Set either to 0 to disable that limit. Tune in the Render Dashboard
      # without a rebuild.
      - key: RATE_LIMIT_PER_MINUTE
        value: "20"
      - key: DAILY_OPERATION_LIMIT
        value: "500"
